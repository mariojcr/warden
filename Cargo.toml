[package]
name = "warden"
version = "0.1.0"
edition = "2024"
publish = false

# An empty `[workspace]` so cargo does not look for a parent workspace when this sits inside another repo.
[workspace]

[dependencies]
anyhow = "1"
axum = "0.8"
# No crypto provider of its own: main.rs installs ring for the whole process, as reqwest uses.
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
base64 = "0.22"
# Inflates a push's pack objects to check its commits (receive.rs).
flate2 = "1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
ring = "0.17"
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
